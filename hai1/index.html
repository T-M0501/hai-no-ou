<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="theme-color" content="#0d0b0a">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta charset="utf-8">

<title>灰の王 — ソウルライク</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#070605;color:#d8cfb8;
  font-family:"Shippori Mincho","Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:5;touch-action:none}
.ov.on{display:flex}
#title{background:radial-gradient(ellipse at 50% 38%,rgba(10,8,6,.35) 0%,rgba(5,4,3,.82) 60%,rgba(3,2,2,.96) 100%);padding:24px}
.kicker{font-size:13px;letter-spacing:.5em;color:#8f8262;margin-bottom:14px;padding-left:.5em}
h1{font-size:clamp(64px,22vw,120px);font-weight:800;letter-spacing:.12em;padding-left:.12em;line-height:1.05;
  background:linear-gradient(180deg,#f3e2ac 0%,#c9a455 45%,#6e5324 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgba(210,150,60,.28))}
.rule{width:min(70vw,300px);height:1px;margin:18px auto;background:linear-gradient(90deg,transparent,#a88d4e,transparent)}
.lead{font-size:14px;line-height:1.9;color:#a99f88;letter-spacing:.12em}
.btn{appearance:none;border:1px solid #a88d4e;background:linear-gradient(180deg,rgba(60,48,24,.55),rgba(20,16,10,.75));color:#eedfae;
  font-family:inherit;font-size:19px;font-weight:800;letter-spacing:.35em;padding:15px 30px 15px calc(30px + .35em);margin-top:26px;min-width:230px;
  box-shadow:0 0 24px rgba(200,150,60,.16),inset 0 0 18px rgba(0,0,0,.5);touch-action:manipulation;cursor:pointer}
.btn:active{background:rgba(120,95,45,.6);transform:scale(.98)}
.btn.sub{font-size:14px;font-weight:500;border-color:#5d5238;color:#b3a682;padding:11px 20px 11px calc(20px + .35em);margin-top:14px;min-width:190px;box-shadow:none}
.stats{margin-top:22px;font-size:13px;color:#8f8672;letter-spacing:.14em;line-height:1.9}
.stats b{color:#d9c58c;font-weight:800}
.help{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));font-size:11.5px;color:#6f6857;letter-spacing:.08em;line-height:1.8;padding:0 16px}
#dead{background:rgba(0,0,0,0);transition:background 1.6s}
#dead.on{background:rgba(0,0,0,.55)}
.band{width:100%;padding:30px 0 34px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.9) 22%,rgba(0,0,0,.9) 78%,transparent)}
#dead .big{font-size:clamp(28px,9.4vw,60px);white-space:nowrap;font-weight:500;color:#9b1c14;letter-spacing:.16em;padding-left:.16em;animation:died 2.4s ease-out both;text-shadow:0 0 28px rgba(160,20,10,.45)}
@keyframes died{0%{opacity:0;transform:scale(.92)}60%{opacity:1}100%{opacity:1;transform:scale(1.04)}}
#dead .after,#win .after{animation:fadeup 1s 1.1s both}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#win{background:rgba(0,0,0,.62)}
#win .big{font-size:clamp(46px,15vw,84px);font-weight:800;letter-spacing:.3em;padding-left:.3em;animation:died 2.6s ease-out both;

.unlock{margin-top:12px;font-size:12px;padding:0 12px;color:#e2b765;letter-spacing:.14em}
#pause{background:rgba(4,3,2,.82)}
#pause h2{font-size:30px;letter-spacing:.5em;padding-left:.5em;color:#d9c58c;font-weight:500}
.land #rotHint{display:none}
.land #title{padding:10px}
.land h1{font-size:clamp(40px,13vh,84px)}
.land .lead{font-size:12.5px;line-height:1.7}
.land .rule{margin:8px auto}
.land .btn{margin-top:12px;padding-top:10px;padding-bottom:10px}
.land .btn.sub{margin-top:8px}
.land .stats{margin-top:8px}
.land .kicker{margin-bottom:6px}
.land .help{display:none}
.hint{margin-top:22px;font-size:12.5px;line-height:2;color:#8f8672;letter-spacing:.08em}

<body>
<canvas id="c"></canvas>
<div id="safe" style="position:fixed;visibility:hidden;pointer-events:none;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)"></div>

<div id="title" class="ov on">
  <div class="kicker">灰冠の騎士王</div>
  <h1>灰の王</h1>
  <div class="rule"></div>
  <div class="lead">崩れた玉座に、まだ王は膝をついている。<br>霧の向こうで、剣を執れ。</div>
  <button id="bStart" class="btn">霧をくぐる</button>
  <button id="bNg" class="btn sub" style="display:none"></button>
  <button id="bFs" class="btn sub" style="display:none">全画面・横向きで遊ぶ</button>
  <div id="rotHint" class="stats" style="margin-top:14px">📱 スマホを横にしても遊べます</div>
  <div id="tStats" class="stats"></div>
  <div class="help">左側をなぞって移動 ／ 右側のボタンで戦う<br>鍵盤：WASD 移動・J 攻撃・K 強攻撃・Space 回避・H 回復</div>
</div>

<div id="dead" class="ov">
  <div class="band"><div class="big">あなたは死んだ</div></div>
  <div class="after">
    <div id="dStats" class="stats"></div>
    <button id="bRetry" class="btn">再挑戦</button><br>
    <button id="bDeadTitle" class="btn sub">題名へ戻る</button>
  </div>
</div>

<div id="win" class="ov">
  <div class="band"><div class="big">王 討伐</div><div class="sub2">灰冠の騎士王は、灰へ還った</div></div>
  <div class="after">
    <div id="wStats" class="stats"></div>
    <div id="wUnlock" class="unlock"></div>
    <button id="bAgain" class="btn">再び挑む</button><br>
    <button id="bWinTitle" class="btn sub">題名へ戻る</button>
  </div>
</div>

<div id="pause" class="ov">
  <h2>小休止</h2>
  <button id="bResume" class="btn">戦いに戻る</button>
  <button id="bMute" class="btn sub"></button>
  <button id="bQuit" class="btn sub">題名へ戻る</button>
  <div class="hint">回避の出始めは無敵。光る剣先が合図。<br>攻撃を重ねると王は体勢を崩す ── そこへ強攻撃を。<br>回復は隙が大きい。王の大技の後に。</div>
</div>

<script>
(() => {

    s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  } catch (e) {}
}
const SFX = {
  swing() { noise(0.13, 0.22, 700, 2600, 1.4); },
  swingH() { noise(0.22, 0.3, 400, 1800, 1.2); },
  bswing() { noise(0.26, 0.42, 260, 1300, 1.0); },
  hit() { noise(0.09, 0.4, 1800, 500, 0.8); tone('square', 190, 70, 0.1, 0.16); },
  hitH() { noise(0.16, 0.55, 1400, 300, 0.7); tone('square', 150, 45, 0.2, 0.26); tone('triangle', 900, 300, 0.12, 0.1); },
  crit() { noise(0.3, 0.6, 2400, 200, 0.6); tone('sawtooth', 220, 40, 0.4, 0.3); tone('triangle', 1320, 660, 0.35, 0.16); },
  roll() { noise(0.2, 0.14, 300, 900, 0.8); },
  hurt() { noise(0.2, 0.5, 900, 150, 0.7); tone('sawtooth', 130, 50, 0.25, 0.3); },
  heal() { tone('sine', 520, 780, 0.35, 0.16); tone('sine', 780, 1170, 0.45, 0.12, 0.12); },
  sip() { noise(0.25, 0.08, 500, 1200, 3); },
  glint() { tone('triangle', 2100, 1500, 0.14, 0.13); tone('sine', 3150, 2400, 0.1, 0.06); },
  slam() { tone('sine', 110, 30, 0.5, 0.6); noise(0.4, 0.5, 500, 80, 0.6, 0, 'lowpass'); },
  spike() { noise(0.12, 0.25, 1500, 400, 1.5); tone('square', 320, 90, 0.1, 0.1); },
  fire() { noise(0.35, 0.25, 500, 1600, 0.8); },
  charge() { tone('sawtooth', 60, 240, 1.4, 0.16); noise(1.4, 0.14, 200, 2400, 2); },
  boom() { tone('sine', 140, 24, 0.9, 0.75); noise(0.8, 0.7, 1200, 60, 0.5, 0, 'lowpass'); },
  roar() { tone('sawtooth', 95, 48, 1.5, 0.4); tone('sawtooth', 143, 60, 1.5, 0.26); noise(1.5, 0.4, 500, 150, 1.2); },
  stagger() { tone('triangle', 660, 220, 0.35, 0.25); noise(0.25, 0.4, 2600, 500, 1); },
  nost() { tone('square', 110, 90, 0.08, 0.08); },
  die() { tone('sawtooth', 110, 30, 2.2, 0.3); tone('sine', 73, 36, 2.6, 0.3); },
  win() { [196, 247, 294, 392].forEach((f, i) => { tone('triangle', f, f, 2.4, 0.13, i * 0.14); tone('sine', f * 2, f * 2, 2.0, 0.05, i * 0.14); }); },
  gate() { noise(1.2, 0.2, 200, 1200, 0.6); tone('sine', 196, 147, 1.2, 0.12); },
  ui() { tone('triangle', 660, 880, 0.08, 0.08); }

/* ---------- canvas ---------- */
const cv = $('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, U = 1, S = 1, vign = null, LAND = false, CY = 0, SAL = 0, SAR = 0;

  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  LAND = W > H * 1.1;
  try { const cs = getComputedStyle(document.getElementById('safe')); SAL = parseFloat(cs.paddingLeft) || 0; SAR = parseFloat(cs.paddingRight) || 0; } catch (e) { SAL = SAR = 0; }
  U = LAND ? clamp(H / 400, 0.72, 1.3) : clamp(Math.min(W, H * 0.62) / 390, 0.78, 1.45);
  S = LAND ? clamp(H / 600, 0.5, 1.5) : clamp(Math.min(W, H * 0.8) / 440, 0.55, 1.6);
  CY = LAND ? H * 0.5 : H * 0.42;
  document.body.classList.toggle('land', LAND);
  vign = document.createElement('canvas'); vign.width = 128; vign.height = 256;
  const g = vign.getContext('2d'), gr = g.createRadialGradient(64, 112, 30, 64, 120, 150);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(0.55, 'rgba(0,0,0,.28)'); gr.addColorStop(1, 'rgba(0,0,0,.88)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 256);
  layoutButtons();
}

/* ---------- sprites & floor ---------- */
function makeGlow(r, g, b) {
  const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
  const gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, `rgba(${r},${g},${b},1)`); gr.addColorStop(0.3, `rgba(${r},${g},${b},.45)`); gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
  x.fillStyle = gr; x.fillRect(0, 0, 64, 64); return c;
}
const SPR = [makeGlow(255, 130, 40), makeGlow(255, 210, 110), makeGlow(235, 240, 255), makeGlow(230, 40, 25), makeGlow(150, 150, 150), makeGlow(40, 36, 32)];
let floorC = null, glowC = null;
const FSZ = 1160, FK = 1.5;
function buildFloor() {

  glowC = document.createElement('canvas'); glowC.width = glowC.height = FSZ;
  const g = floorC.getContext('2d'); g.scale(FK, FK); g.translate(FSZ / 2, FSZ / 2);
  g.fillStyle = '#060504'; g.fillRect(-FSZ / 2, -FSZ / 2, FSZ, FSZ);
  const R = R_ARENA;
  let gr = g.createRadialGradient(0, 0, 30, 0, 0, R + 16);
  gr.addColorStop(0, '#403b33'); gr.addColorStop(0.6, '#2b2823'); gr.addColorStop(1, '#171512');
  g.beginPath(); g.arc(0, 0, R + 16, 0, TAU); g.fillStyle = gr; g.fill();
  const rings = [0, 62, 132, 204, 276, 348, 416, R + 16];
  for (let i = 0; i < rings.length - 1; i++) {
    const r0 = rings[i], r1 = rings[i + 1], n = i === 0 ? 1 : Math.round((r0 + r1) * PI / 74), off = rr() * TAU;
    for (let j = 0; j < n; j++) {
      const a0 = off + j / n * TAU, a1 = off + (j + 1) / n * TAU, sh = rr();
      g.beginPath(); g.arc(0, 0, r1, a0, a1); g.arc(0, 0, r0, a1, a0, true); g.closePath();
      g.fillStyle = sh < 0.5 ? `rgba(0,0,0,${(0.5 - sh) * 0.3})` : `rgba(255,240,210,${(sh - 0.5) * 0.07})`; g.fill();
      g.strokeStyle = 'rgba(0,0,0,.42)'; g.lineWidth = 1.6; g.stroke();
      g.strokeStyle = 'rgba(255,240,210,.035)'; g.lineWidth = 0.7; g.beginPath(); g.arc(0, 0, r1 - 1.6, a0, a1); g.stroke();

  g.strokeStyle = 'rgba(200,165,90,.10)'; g.lineWidth = 2;
  g.beginPath(); g.arc(0, 0, 100, 0, TAU); g.stroke(); g.beginPath(); g.arc(0, 0, 118, 0, TAU); g.stroke();
  g.beginPath(); for (let i = 0; i < 8; i++) { const a = i / 8 * TAU; g.moveTo(Math.cos(a) * 34, Math.sin(a) * 34); g.lineTo(Math.cos(a) * 100, Math.sin(a) * 100); } g.stroke();

  for (let i = 0; i < 1500; i++) { const a = rr() * TAU, d = Math.sqrt(rr()) * R, s = rr() * 2.2 + 0.4; g.fillStyle = rr() < 0.6 ? `rgba(0,0,0,${rr() * 0.3})` : `rgba(220,210,190,${rr() * 0.07})`; g.fillRect(Math.cos(a) * d, Math.sin(a) * d, s, s); }
  for (let i = 0; i < 26; i++) { const a = rr() * TAU, d = Math.sqrt(rr()) * (R - 20), s = 20 + rr() * 50; g.globalAlpha = 0.25 + rr() * 0.3; g.drawImage(SPR[5], Math.cos(a) * d - s, Math.sin(a) * d - s, s * 2, s * 2); } g.globalAlpha = 1;
