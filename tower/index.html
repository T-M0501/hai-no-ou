<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="theme-color" content="#1b1b2f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="つみつみタワー">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>つみつみタワー</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1b1b2f;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;top:28px;left:0;right:0;text-align:center;color:#fff;pointer-events:none}
#score{font-size:68px;font-weight:800;line-height:1;text-shadow:0 3px 12px rgba(0,0,0,.25)}
#combo{margin-top:8px;font-size:18px;font-weight:700;opacity:0;transition:opacity .25s}
#overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;pointer-events:none;padding:24px}
#overlay h1{font-size:40px;margin:0 0 12px;letter-spacing:.05em}
#overlay p{margin:6px 0;font-size:17px;opacity:.9}
#overlay .big{font-size:22px;font-weight:700;margin-top:28px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
.hidden{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="hidden"><div id="score">0</div><div id="combo">PERFECT!</div></div>
<div id="overlay">
  <h1>つみつみタワー</h1>
  <p>動くブロックをタップで落として積み上げよう</p>
  <p>はみ出た部分は切り落とされる</p>
  <p>ピッタリ3連続でブロックが少し広がる！</p>
  <p id="bestStart"></p>
  <div class="big">タップでスタート</div>
</div>
<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const hud = document.getElementById('hud'), scoreEl = document.getElementById('score'), comboEl = document.getElementById('combo');
const overlay = document.getElementById('overlay');
let W, H, dpr, BH, BASE;
function resize(){
  dpr = Math.min(window.devicePixelRatio||1, 3);
  W = innerWidth; H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  BH = Math.max(28, Math.round(H*0.045));
  BASE = Math.min(W*0.62, 360);
}
addEventListener('resize', resize); resize();

function loadBest(){ try{ return +localStorage.getItem('tsumi_best')||0 }catch(e){ return 0 } }
function saveBest(v){ try{ localStorage.setItem('tsumi_best', v) }catch(e){} }
let best = loadBest();
const bestText = () => best ? `ベスト：${best}` : '';
document.getElementById('bestStart').textContent = bestText();

// audio
let ac = null;
function beep(freq, dur=0.09, type='triangle', vol=0.15){
  try{
    if(!ac) ac = new (window.AudioContext||window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+dur);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime+dur);
  }catch(e){}
}
function buzz(ms){ try{ navigator.vibrate && navigator.vibrate(ms) }catch(e){} }

let state = 'start', stack, cur, pieces, particles, combo, camY, hue0, overTime, flash;
const color = (i, l=60) => `hsl(${(hue0 + i*7)%360},65%,${l}%)`;

function reset(){
  hue0 = Math.random()*360;
  stack = [{x:(W-BASE)/2, w:BASE}];
  pieces = []; particles = []; combo = 0; camY = 0; flash = 0;
  spawn();
  scoreEl.textContent = '0';
}
function spawn(){
  const top = stack[stack.length-1];
  const lvl = stack.length;
  const fromLeft = lvl % 2 === 0;
  const speed = Math.min(2.2 + lvl*0.07, 7.5) * (W/400);
  cur = { w: top.w, x: fromLeft ? -top.w : W, dir: fromLeft ? 1 : -1, speed };
}
function levelY(i){ return H - 120 - (i+1)*BH; } // world y of top edge of level i

function drop(){
  const top = stack[stack.length-1];
  const i = stack.length;
  const diff = cur.x - top.x;
  const tol = Math.max(4, W*0.012);
  if(Math.abs(diff) < tol){
    combo++;
    let w = top.w, x = top.x;
    if(combo >= 3){ const nw = Math.min(BASE, w + BASE*0.06); x -= (nw-w)/2; w = nw; }
    stack.push({x, w});
    burst(x + w/2, levelY(i) + BH/2, i);
    flash = 1;
    beep(440 * Math.pow(1.06, Math.min(combo,20)), 0.14, 'sine', 0.2);
    buzz(15);
    comboEl.textContent = combo >= 2 ? `PERFECT ×${combo}` : 'PERFECT!';
    comboEl.style.opacity = 1;
    clearTimeout(drop.t); drop.t = setTimeout(()=>comboEl.style.opacity=0, 700);
  } else {
    combo = 0;
    const L = Math.max(cur.x, top.x), R = Math.min(cur.x+cur.w, top.x+top.w);
    if(R <= L){ // miss
      pieces.push({x:cur.x, y:levelY(i), w:cur.w, vy:0, vx:cur.dir*2, rot:0, vr:cur.dir*0.05, i});
      gameOver(); return;
    }
    // cut piece
    if(cur.x < top.x) pieces.push({x:cur.x, y:levelY(i), w:L-cur.x, vy:0, vx:-1.5, rot:0, vr:-0.04, i});
    else pieces.push({x:R, y:levelY(i), w:(cur.x+cur.w)-R, vy:0, vx:1.5, rot:0, vr:0.04, i});
    stack.push({x:L, w:R-L});
    beep(300 + Math.min(stack.length,40)*6, 0.08);
    buzz(8);
  }
  scoreEl.textContent = stack.length-1;
  spawn();
}
function burst(x, y, i){
  for(let k=0;k<18;k++){
    const a = Math.random()*Math.PI*2, s = 1.5+Math.random()*3.5;
    particles.push({x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s-1, life:1, i});
  }
}
function gameOver(){
  state = 'over'; overTime = performance.now();
  cur = null;
  const score = stack.length-1;
  const isNew = score > best;
  if(isNew){ best = score; saveBest(best); }
  beep(180, 0.35, 'sawtooth', 0.12); buzz([40,60,80]);
  overlay.innerHTML = `<h1>${score}段</h1>${isNew && score>0 ? '<p>🎉 ベスト更新！</p>' : `<p>ベスト：${best}段</p>`}<div class="big">タップでもう一回</div>`;
  setTimeout(()=>{ if(state==='over') overlay.classList.remove('hidden'); }, 600);
}

function onTap(e){
  e.preventDefault();
  if(state === 'start' || (state === 'over' && performance.now()-overTime > 700)){
    reset(); state = 'play';
    overlay.classList.add('hidden'); hud.classList.remove('hidden');
    beep(520, 0.08);
  } else if(state === 'play'){
    drop();
  }
}
addEventListener('pointerdown', onTap, {passive:false});
addEventListener('keydown', e => { if(e.code==='Space'||e.code==='Enter') onTap(e); });

function drawBlock(x, y, w, i){
  ctx.fillStyle = color(i, 42);           // side shade
  ctx.fillRect(x, y + BH*0.72, w, BH*0.28);
  ctx.fillStyle = color(i, 60);
  ctx.fillRect(x, y, w, BH*0.72);
  ctx.fillStyle = 'rgba(255,255,255,.25)';
  ctx.fillRect(x, y, w, 3);
}

let last = performance.now();
function loop(now){
  const dt = Math.min(2.5, (now-last)/16.667); last = now;
  if(!stack) reset();

  // update
  if(state==='play' && cur){
    cur.x += cur.dir*cur.speed*dt;
    const minX = -cur.w*0.6, maxX = W - cur.w*0.4;
    if(cur.x > maxX){ cur.x = maxX; cur.dir = -1; }
    if(cur.x < minX){ cur.x = minX; cur.dir = 1; }
  }
  const targetCam = Math.max(0, (stack.length+1)*BH - H*0.45);
  camY += (targetCam - camY) * 0.12 * dt;
  for(const p of pieces){ p.vy += 0.5*dt; p.y += p.vy*dt; p.x += p.vx*dt; p.rot += p.vr*dt; }
  pieces = pieces.filter(p => p.y + camY < H + 200);
  for(const p of particles){ p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 0.12*dt; p.life -= 0.025*dt; }
  particles = particles.filter(p => p.life > 0);
  flash = Math.max(0, flash - 0.06*dt);

  // background
  const h = (hue0 + stack.length*7) % 360;
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, `hsl(${(h+40)%360},45%,22%)`);
  g.addColorStop(1, `hsl(${h},50%,12%)`);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.translate(0, camY);
  // ground
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  ctx.fillRect(0, levelY(0)+BH, W, 2000);
  // stack (only visible)
  for(let i=0;i<stack.length;i++){
    const y = levelY(i);
    if(y + camY > H + BH || y + camY < -BH) continue;
    const b = stack[i];
    drawBlock(b.x, y, b.w, i);
  }
  if(flash > 0){
    const i = stack.length-1, b = stack[i];
    ctx.strokeStyle = `rgba(255,255,255,${flash})`; ctx.lineWidth = 3;
    ctx.strokeRect(b.x-2, levelY(i)-2, b.w+4, BH+4);
  }
  if(cur) drawBlock(cur.x, levelY(stack.length), cur.w, stack.length);
  for(const p of pieces){
    ctx.save();
    ctx.translate(p.x + p.w/2, p.y + BH/2); ctx.rotate(p.rot);
    drawBlock(-p.w/2, -BH/2, p.w, p.i);
    ctx.restore();
  }
  for(const p of particles){
    ctx.globalAlpha = p.life;
    ctx.fillStyle = color(p.i, 80);
    ctx.fillRect(p.x-3, p.y-3, 6, 6);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
