<body>
<canvas id="c"></canvas>
<div id="safe" style="position:fixed;visibility:hidden;pointer-events:none;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)"></div>

<div id="title" class="ov on">
  <div class="kicker">灰の城</div>
  <h1>灰の王 <span class="ii">II</span></h1>
  <div class="rule"></div>
  <div class="lead">王は、灰の城の最奥に在る。<br>篝火を辿り、霧の門へ至れ。</div>
  <button id="bCont" class="btn" style="display:none">つづきから</button>
  <button id="bNew" class="btn">はじめから</button>
  <button id="bFs" class="btn sub" style="display:none">全画面・横向きで遊ぶ</button>
  <div id="rotHint" class="stats" style="margin-top:14px">📱 スマホを横にしても遊べます</div>
  <div id="tStats" class="stats"></div>
  <div class="help">左側をなぞって移動 ／ 右側のボタンで戦う<br>篝火・宝箱・扉は「調べる」<br>鍵盤：WASD 移動・J 攻撃・K 強攻撃<br>Space 回避・H 回復・E 調べる</div>
</div>

<div id="confirm" class="ov">
  <h2>はじめから</h2>
  <p>これまでの旅の記録（ソウル・レベル・武器）は<br>すべて灰に還ります。よろしいですか？</p>
  <button id="bYes" class="btn">灰に還す</button>
  <button id="bNo" class="btn sub">やめる</button>
</div>

<div id="dead" class="ov">
  <div class="band"><div class="big">あなたは死んだ</div></div>
  <div class="after">
    <div id="dStats" class="stats"></div>
    <button id="bRetry" class="btn">篝火で目覚める</button><br>
    <button id="bDeadTitle" class="btn sub">題名へ戻る</button>
  </div>
</div>

<div id="win" class="ov">
  <div class="band"><div class="big">王 討伐</div><div class="sub2">灰冠の騎士王は、灰へ還った</div></div>
  <div class="after">
    <div id="wStats" class="stats"></div>
    <div id="wUnlock" class="unlock"></div>
    <button id="bAgain" class="btn">旅を続ける</button><br>
    <button id="bWinTitle" class="btn sub">題名へ戻る</button>
  </div>
</div>

<div id="pause" class="ov">
  <h2>小休止</h2>
  <button id="bResume" class="btn">旅に戻る</button>
  <button id="bMute" class="btn sub"></button>
  <button id="bQuit" class="btn sub">題名へ戻る</button>
  <div class="hint">回避の出始めは無敵。赤い予兆が合図。<br>死ねばソウルは血痕に残る。<br>取り戻す前に再び死ねば、永遠に失われる。<br>篝火で休めば亡者は蘇る。ソウルは篝火で力に。</div>
</div>

<div id="bonfire" class="ov">
  <div class="bf">
    <div id="bfName" class="bfName"></div>
    <div id="bfInfo" class="bfInfo"></div>
    <div id="bfMain" class="bfPane on">
      <button id="bRest" class="btn">休息</button>
      <button id="bLevel" class="btn">レベルアップ</button>
      <button id="bWeapon" class="btn">武器を持ち替える</button>
      <button id="bLeave" class="btn">旅立つ</button>
    </div>
    <div id="bfLevel" class="bfPane">
      <div id="lvRows" class="rows"></div>
      <button id="bLvBack" class="btn sub">戻る</button>
    </div>
    <div id="bfWeapon" class="bfPane">
      <div id="wpRows" class="rows"></div>
      <button id="bWpBack" class="btn sub">戻る</button>
    </div>
    <div id="bfNote"></div>
  </div>
</div>

<script>
(() => {
'use strict';
/* ---------- utils ---------- */
const TAU = Math.PI * 2, PI = Math.PI, R_ARENA = 470;
const rnd = (a, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
function angDiff(a, b) { let d = (a - b) % TAU; if (d > PI) d -= TAU; if (d < -PI) d += TAU; return d; }
function turnTo(cur, tgt, max) { const d = angDiff(tgt, cur); return Math.abs(d) <= max ? tgt : cur + Math.sign(d) * max; }
const FONT = '"Shippori Mincho","Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif';
const $ = id => document.getElementById(id);
const fmtN = n => String(Math.floor(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

/* ---------- save ---------- */
const SAVE_KEY = 'hai_no_ou2_v1';
function freshSave() { return { started: false, deaths: 0, souls: 0, st: { vit: 10, end: 10, str: 10, dex: 10, fth: 10 }, weapons: ['sword'], weapon: 'sword', flaskMax: 3, chests: {}, door: false, lit: {}, bonfire: 0, stain: null, bossDead: false, time: 0, rooms: {} }; }
const save = Object.assign(freshSave(), { mute: false, best: 0, wins: 0, clear: 0 });
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s && typeof s === 'object') Object.assign(save, s); } catch (e) {}
function sanitize() {
  const f = freshSave();
  if (!save.st || typeof save.st !== 'object') save.st = f.st;
  for (const k in f.st) { const v = save.st[k]; save.st[k] = typeof v === 'number' && v >= 10 && v <= 99 ? Math.floor(v) : 10; }
  if (!Array.isArray(save.weapons)) save.weapons = ['sword'];
  save.weapons = save.weapons.filter(w => WPN[w]); if (!save.weapons.includes('sword')) save.weapons.unshift('sword');
  if (!WPN[save.weapon] || !save.weapons.includes(save.weapon)) save.weapon = 'sword';
  for (const k of ['chests', 'lit', 'rooms']) if (!save[k] || typeof save[k] !== 'object') save[k] = {};
  save.souls = Math.max(0, Math.floor(+save.souls || 0)); save.flaskMax = clamp(Math.floor(+save.flaskMax || 3), 3, 6);
  save.bonfire = clamp(Math.floor(+save.bonfire || 0), 0, 2); save.time = +save.time || 0; save.deaths = Math.floor(+save.deaths || 0);
  const s = save.stain; if (s && !(typeof s === 'object' && isFinite(s.x) && isFinite(s.y) && s.s > 0 && (s.z === 'a' || s.z === 'd'))) save.stain = null;
}
function writeSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
function fmtTime(t) { const m = Math.floor(t / 60), s = t - m * 60; return m + '分' + (s < 10 ? '0' : '') + s.toFixed(1) + '秒'; }
function vib(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

/* ---------- audio ---------- */
let AC = null, master = null, noiseBuf = null, droneG = null, droneF = null;
function initAudio() {
  if (AC) { try { if (AC.state === 'suspended') AC.resume(); } catch (e) {} return; }
  try {
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    AC = new C();
    master = AC.createGain(); master.gain.value = save.mute ? 0 : 0.55; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    droneG = AC.createGain(); droneG.gain.value = 0; droneF = AC.createBiquadFilter(); droneF.type = 'lowpass'; droneF.frequency.value = 150;
    droneF.connect(droneG); droneG.connect(master);
    for (const f of [55, 55.7, 82.1]) { const o = AC.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.connect(droneF); o.start(); }
  } catch (e) { AC = null; }
}
function setDrone(v, cut) { if (!AC) return; try { droneG.gain.setTargetAtTime(v, AC.currentTime, 0.8); droneF.frequency.setTargetAtTime(cut, AC.currentTime, 0.8); } catch (e) {} }
function tone(type, f0, f1, dur, vol, delay) {
  if (!AC) return; try {
    const t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
  } catch (e) {}
}
function noise(dur, vol, f0, f1, q, delay, type) {
  if (!AC) return; try {
    const t = AC.currentTime + (delay || 0), s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = noiseBuf; s.loop = true; f.type = type || 'bandpass'; f.Q.value = q || 1;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  } catch (e) {}
}
const SFX = {
  swing() { noise(0.13, 0.22, 700, 2600, 1.4); },
  swingH() { noise(0.22, 0.3, 400, 1800, 1.2); },
  bswing() { noise(0.26, 0.42, 260, 1300, 1.0); },
  hit() { noise(0.09, 0.4, 1800, 500, 0.8); tone('square', 190, 70, 0.1, 0.16); },
  hitH() { noise(0.16, 0.55, 1400, 300, 0.7); tone('square', 150, 45, 0.2, 0.26); tone('triangle', 900, 300, 0.12, 0.1); },
  crit() { noise(0.3, 0.6, 2400, 200, 0.6); tone('sawtooth', 220, 40, 0.4, 0.3); tone('triangle', 1320, 660, 0.35, 0.16); },
  roll() { noise(0.2, 0.14, 300, 900, 0.8); },
  hurt() { noise(0.2, 0.5, 900, 150, 0.7); tone('sawtooth', 130, 50, 0.25, 0.3); },
  heal() { tone('sine', 520, 780, 0.35, 0.16); tone('sine', 780, 1170, 0.45, 0.12, 0.12); },
  sip() { noise(0.25, 0.08, 500, 1200, 3); },
  glint() { tone('triangle', 2100, 1500, 0.14, 0.13); tone('sine', 3150, 2400, 0.1, 0.06); },
  slam() { tone('sine', 110, 30, 0.5, 0.6); noise(0.4, 0.5, 500, 80, 0.6, 0, 'lowpass'); },
  spike() { noise(0.12, 0.25, 1500, 400, 1.5); tone('square', 320, 90, 0.1, 0.1); },
  fire() { noise(0.35, 0.25, 500, 1600, 0.8); },
  charge() { tone('sawtooth', 60, 240, 1.4, 0.16); noise(1.4, 0.14, 200, 2400, 2); },
  boom() { tone('sine', 140, 24, 0.9, 0.75); noise(0.8, 0.7, 1200, 60, 0.5, 0, 'lowpass'); },
  roar() { tone('sawtooth', 95, 48, 1.5, 0.4); tone('sawtooth', 143, 60, 1.5, 0.26); noise(1.5, 0.4, 500, 150, 1.2); },
  stagger() { tone('triangle', 660, 220, 0.35, 0.25); noise(0.25, 0.4, 2600, 500, 1); },
  nost() { tone('square', 110, 90, 0.08, 0.08); },
  die() { tone('sawtooth', 110, 30, 2.2, 0.3); tone('sine', 73, 36, 2.6, 0.3); },
  win() { [196, 247, 294, 392].forEach((f, i) => { tone('triangle', f, f, 2.4, 0.13, i * 0.14); tone('sine', f * 2, f * 2, 2.0, 0.05, i * 0.14); }); },
  gate() { noise(1.2, 0.2, 200, 1200, 0.6); tone('sine', 196, 147, 1.2, 0.12); },
  ui() { tone('triangle', 660, 880, 0.08, 0.08); }
};
Object.assign(SFX, {
  parry() { tone('triangle', 1700, 900, 0.2, 0.3); noise(0.12, 0.5, 3200, 1200, 2); tone('sine', 2600, 2000, 0.25, 0.1); },
  bleed() { noise(0.3, 0.5, 900, 200, 0.8); tone('sawtooth', 210, 60, 0.3, 0.2); },
  bonfire() { noise(1.2, 0.25, 300, 900, 0.6); tone('sine', 220, 330, 1.2, 0.12); tone('sine', 330, 440, 1.4, 0.08, 0.2); },
  chest() { tone('triangle', 520, 780, 0.2, 0.14); tone('triangle', 780, 1040, 0.3, 0.12, 0.15); },
  souls() { tone('sine', 880, 1320, 0.4, 0.07); tone('sine', 1320, 1760, 0.5, 0.04, 0.1); },
